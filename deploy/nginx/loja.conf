# Loja Fermento Vivo · {{DOMINIO}}
# O Certbot acrescenta o bloco HTTPS (porta 443) e o redirecionamento na primeira execução.

server {
	listen 80;
	listen [::]:80;
	server_name {{DOMINIO}} www.{{DOMINIO}};

	root /var/www/{{DOMINIO}}/public;
	index index.php;

	access_log /var/www/{{DOMINIO}}/logs/acesso.log;
	error_log  /var/www/{{DOMINIO}}/logs/erro.log warn;

	client_max_body_size 64m;

	# www → sem www
	if ($host = www.{{DOMINIO}}) {
		return 301 $scheme://{{DOMINIO}}$request_uri;
	}

	# --- Segurança -----------------------------------------------------------
	add_header Strict-Transport-Security "max-age=31536000" always;

	location = /xmlrpc.php            { deny all; access_log off; }
	location ~ /\.(?!well-known)      { deny all; }
	location ~* /(?:uploads|files)/.*\.php$ { deny all; }
	location ~* ^/wp-content/.*\.(?:sql|log|bak|env|sh)$ { deny all; }
	location ~* /(wp-config\.php|readme\.html|license\.txt)$ { deny all; }

	# Limite de tentativas no login (a zona "login" está em conf.d/loja-cache.conf).
	location = /wp-login.php {
		limit_req zone=login burst=5 nodelay;
		include snippets/fastcgi-php.conf;
		fastcgi_pass unix:/run/php/php{{PHP_VER}}-fpm-loja.sock;
	}

	# --- Arquivos estáticos: cache longo no navegador ------------------------
	location ~* \.(?:css|js|mjs|woff2?|ttf|svg|ico|png|jpe?g|gif|webp|avif)$ {
		expires 180d;
		add_header Cache-Control "public, immutable";
		access_log off;
		try_files $uri =404;
	}

	# --- Cache de página (só para visitantes sem carrinho e sem login) -------
	set $sem_cache 0;
	if ($request_method = POST)              { set $sem_cache 1; }
	if ($query_string != "")                  { set $sem_cache 1; }
	if ($request_uri ~* "/(carrinho|finalizar-compra|minha-conta|wp-admin|wp-json|wc-api|addons|feed)/?") { set $sem_cache 1; }
	if ($request_uri ~* "(/wp-login\.php|/xmlrpc\.php|sitemap(_index)?\.xml|/wp-sitemap)") { set $sem_cache 1; }
	if ($http_cookie ~* "comment_author|wordpress_[a-f0-9]+|wp-postpass|wordpress_logged_in|woocommerce_items_in_cart|woocommerce_cart_hash|wp_woocommerce_session_") { set $sem_cache 1; }

	location / {
		try_files $uri $uri/ /index.php?$args;
	}

	location ~ \.php$ {
		include snippets/fastcgi-php.conf;
		fastcgi_pass unix:/run/php/php{{PHP_VER}}-fpm-loja.sock;
		fastcgi_read_timeout 120s;

		fastcgi_cache loja;
		fastcgi_cache_valid 200 301 10m;
		fastcgi_cache_bypass $sem_cache;
		fastcgi_no_cache $sem_cache;
		fastcgi_cache_use_stale error timeout updating http_500;
		fastcgi_cache_lock on;
		add_header X-Cache $upstream_cache_status;
		add_header Strict-Transport-Security "max-age=31536000" always;
	}

	gzip on;
	gzip_comp_level 5;
	gzip_min_length 1024;
	gzip_types text/css application/javascript application/json image/svg+xml text/xml application/xml;
}
