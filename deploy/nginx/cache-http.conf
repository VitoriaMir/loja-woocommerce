# Vai em /etc/nginx/conf.d/: zonas compartilhadas pela loja.

# Cache de página: até 1 GB em disco, entradas sem acesso por 60 min são descartadas.
fastcgi_cache_path /var/cache/nginx/loja levels=1:2 keys_zone=loja:64m max_size=1g inactive=60m use_temp_path=off;
fastcgi_cache_key "$scheme$request_method$host$request_uri";

# Login: no máximo 10 tentativas por minuto por IP.
limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;
