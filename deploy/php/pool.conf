; Pool PHP-FPM da loja {{DOMINIO}}. Ajuste pm.max_children à memória do VPS:
; cada processo usa ~60-90 MB. VPS de 2 GB → 12; 4 GB → 24.
[loja]
user = www-data
group = www-data
listen = /run/php/php{{PHP_VER}}-fpm-loja.sock
listen.owner = www-data
listen.group = www-data

pm = dynamic
pm.max_children = 12
pm.start_servers = 3
pm.min_spare_servers = 2
pm.max_spare_servers = 5
pm.max_requests = 500

php_admin_value[open_basedir] = /var/www/{{DOMINIO}}/:/tmp/:/usr/share/php/
php_admin_value[disable_functions] = exec,passthru,shell_exec,system,proc_open,popen
php_admin_value[error_log] = /var/www/{{DOMINIO}}/logs/php.log
php_admin_flag[log_errors] = on
